# Build (template, zip ekstensi, userscript) lalu terbitkan folder website/ ke GitHub Pages.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # rilis terakhir di GitHub Pages: arahkan pembaruan userscript ke Vercel
          SITE_URL: https://autokonvert.vercel.app

      - run: npm test

      # Website sudah pindah ke Vercel: halaman utama GitHub Pages dialihkan ke sana,
      # file di /assets tetap ada untuk userscript lama yang mengecek pembaruan.
      - name: Alihkan ke Vercel
        run: |
          cat > website/index.html <<'HTML'
          <!doctype html>
          <html lang="id"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AutoKonvert pindah ke Vercel</title>
          <link rel="canonical" href="https://autokonvert.vercel.app/">
          <meta http-equiv="refresh" content="0; url=https://autokonvert.vercel.app/">
          <script>location.replace("https://autokonvert.vercel.app/" + location.hash)</script>
          </head><body style="font-family:system-ui,sans-serif;padding:24px">
          AutoKonvert sudah pindah ke <a href="https://autokonvert.vercel.app/">autokonvert.vercel.app</a>.
          </body></html>
          HTML

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
