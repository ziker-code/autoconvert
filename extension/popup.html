<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; font: 13px/1.55 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; color: #0F1B2D; background: #fff; }
    .ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #E1E7EF; }
    .mark { width: 28px; height: 28px; border-radius: 6px; background: #0B2F5B; color: #fff; display: grid; place-items: center; }
    .mark .ic { stroke-width: 2; }
    header b { font-weight: 600; font-size: 14px; }
    header span { display: block; font-size: 11.5px; color: #55627A; }
    main { padding: 12px 14px 14px; }
    ol { margin: 0 0 14px; padding-left: 18px; }
    li { margin-bottom: 6px; }
    button { width: 100%; height: 36px; border: 0; border-radius: 8px; background: #0B2F5B; color: #fff; font: inherit; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    button:hover { background: #08254A; }
    .note { display: flex; gap: 8px; margin-top: 12px; color: #55627A; font-size: 12px; }
    .note .ic { width: 14px; height: 14px; margin-top: 2px; }
  </style>
</head>
<body>
  <header>
    <span class="mark"><svg class="ic" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span>
    <div><b>AutoKonvert Logbook</b><span>Student Portal IPB</span></div>
  </header>
  <main>
    <ol>
      <li>Login ke Student Portal.</li>
      <li>Buka <b>Kemahasiswaan → Aktivitas</b>, lalu tombol <b>Log</b> pada aktivitas berstatus <b>Draft</b>.</li>
      <li>Klik tombol <b>AutoKonvert</b> di kanan bawah halaman.</li>
    </ol>
    <button id="buka">Buka halaman Aktivitas
      <svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
    <div class="note">
      <svg class="ic" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
      <span>Bekerja dengan sesi login kamu sendiri. Password tidak pernah disimpan.</span>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
